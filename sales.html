    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .animate-fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .status-completed { background-color: #f0fdf4; border-left: 4px solid #22c55e; }
        .status-pending { background-color: #fffbeb; border-left: 4px solid #f59e0b; }
        .status-cancelled { background-color: #fef2f2; border-left: 4px solid #ef4444; }
    </style>
</head>

                        <select id="productName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500">

                            <option value="무선 마우스">무선 마우스</option>
                            <option value="블루투스 스피커">블루투스 스피커</option>
                            <option value="노트북 가방">노트북 가방</option>
                            <option value="티셔츠">티셔츠</option>
                            <option value="청바지">청바지</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">수량</label>

                            <label class="block text-sm font-medium text-gray-700 mb-1">단가</label>
                            <input type="number" id="unitPrice" required min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">총 금액</label>
                        <input type="text" id="totalAmount" readonly class="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2">

            </div>

    <script>
        // 판매 관리 시스템
        class SalesManager {
            constructor() {
                this.sales = [
                    { id: 1, customer: '김철수', product: '무선 마우스', amount: 25000, status: 'completed', date: '2025-01-10', quantity: 2 },
                    { id: 2, customer: '이영희', product: '블루투스 스피커', amount: 45000, status: 'pending', date: '2025-01-10', quantity: 1 },
                    { id: 3, customer: '박지영', product: '노트북 가방', amount: 35000, status: 'completed', date: '2025-01-09', quantity: 1 },
                    { id: 4, customer: '김민수', product: '티셔츠', amount: 30000, status: 'completed', date: '2025-01-09', quantity: 2 },
                    { id: 5, customer: '이하늘', product: '청바지', amount: 45000, status: 'cancelled', date: '2025-01-08', quantity: 1 },
                    { id: 6, customer: '박서준', product: '스마트워치', amount: 180000, status: 'completed', date: '2025-01-08', quantity: 1 },
                    { id: 7, customer: '김다은', product: '헤드폰', amount: 75000, status: 'pending', date: '2025-01-07', quantity: 1 },
                    { id: 8, customer: '이우진', product: '티셔츠', amount: 45000, status: 'completed', date: '2025-01-07', quantity: 3 }
                ];
                this.filteredSales = [...this.sales];
                this.init();
            }

            init() {
                this.renderSales();
                this.setupEventListeners();
                this.initializeCharts();
                this.animateElements();
            }

            renderSales() {
                const tbody = document.getElementById('salesTableBody');
                tbody.innerHTML = '';

                this.filteredSales.forEach(sale => {
                    const row = document.createElement('tr');
                    row.className = `status-${sale.status} hover:bg-gray-50 transition-colors`;
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                            #${String(sale.id).padStart(5, '0')}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${sale.customer}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${sale.product} (${sale.quantity}개)
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ₩${sale.amount.toLocaleString()}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
                                ${sale.status === 'completed' ? 'bg-green-100 text-green-800' : 
                                  sale.status === 'pending' ? 'bg-yellow-100 text-yellow-800' : 
                                  'bg-red-100 text-red-800'}">
                                ${this.getStatusName(sale.status)}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${sale.date}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button onclick="salesManager.viewSale(${sale.id})" 
                                    class="text-blue-600 hover:text-blue-900 mr-3">상세</button>
                            ${sale.status === 'pending' ? 
                                `<button onclick="salesManager.completeSale(${sale.id})" 
                                        class="text-green-600 hover:text-green-900 mr-3">완료</button>` : ''}
                            <button onclick="salesManager.cancelSale(${sale.id})" 
                                    class="text-red-600 hover:text-red-900">취소</button>
                        </td>
                    `;
                    
                    tbody.appendChild(row);
                });
            }

            getStatusName(status) {
                const statuses = {
                    'completed': '완료',
                    'pending': '처리중',
                    'cancelled': '취소'
                };
                return statuses[status] || status;
            }

            setupEventListeners() {
                // 새 판매 모달
                document.getElementById('newSaleBtn').addEventListener('click', () => {
                    this.showNewSaleModal();
                });

                document.getElementById('closeSaleModal').addEventListener('click', () => {
                    this.hideNewSaleModal();
                });

                document.getElementById('cancelSale').addEventListener('click', () => {
                    this.hideNewSaleModal();
                });

                // 새 판매 폼
                document.getElementById('newSaleForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addNewSale();
                });

                // 수량과 단가 변경 시 총 금액 계산
                document.getElementById('quantity').addEventListener('input', () => {
                    this.calculateTotal();
                });

                document.getElementById('unitPrice').addEventListener('input', () => {
                    this.calculateTotal();
                });

                // 필터
                document.getElementById('dateFilter').addEventListener('change', () => {
                    this.filterSales();
                });

                document.getElementById('statusFilter').addEventListener('change', () => {
                    this.filterSales();
                });
            }

            showNewSaleModal() {
                document.getElementById('newSaleModal').classList.remove('hidden');
                anime({
                    targets: '#newSaleModal .bg-white',
                    scale: [0.8, 1],
                    opacity: [0, 1],
                    duration: 300,
                    easing: 'easeOutQuad'
                });
            }

            hideNewSaleModal() {
                anime({
                    targets: '#newSaleModal .bg-white',
                    scale: [1, 0.8],
                    opacity: [1, 0],
                    duration: 200,
                    easing: 'easeInQuad',
                    complete: () => {
                        document.getElementById('newSaleModal').classList.add('hidden');
                        document.getElementById('newSaleForm').reset();
                    }
                });
            }

            calculateTotal() {
                const quantity = parseInt(document.getElementById('quantity').value) || 0;
                const unitPrice = parseInt(document.getElementById('unitPrice').value) || 0;
                const total = quantity * unitPrice;
                document.getElementById('totalAmount').value = total > 0 ? `₩${total.toLocaleString()}` : '';
            }

            addNewSale() {
                const customerName = document.getElementById('customerName').value;
                const productName = document.getElementById('productName').value;
                const quantity = parseInt(document.getElementById('quantity').value);
                const unitPrice = parseInt(document.getElementById('unitPrice').value);
                const totalAmount = quantity * unitPrice;

                const newSale = {
                    id: Math.max(...this.sales.map(s => s.id)) + 1,
                    customer: customerName,
                    product: productName,
                    amount: totalAmount,
                    status: 'pending',
                    date: new Date().toISOString().split('T')[0],
                    quantity: quantity
                };

                this.sales.unshift(newSale);
                this.filterSales();
                this.hideNewSaleModal();
                this.updateCharts();
                this.showNotification('새 판매가 등록되었습니다!', 'success');
            }

            viewSale(id) {
                this.showNotification('상세 보기 기능은 준비 중입니다!', 'info');
            }

            completeSale(id) {
                const sale = this.sales.find(s => s.id === id);
                if (sale) {
                    sale.status = 'completed';
                    this.filterSales();
                    this.showNotification('판매가 완료 처리되었습니다!', 'success');
                }
            }

            cancelSale(id) {
                if (confirm('정말로 이 판매를 취소하시겠습니까?')) {
                    const sale = this.sales.find(s => s.id === id);
                    if (sale) {
                        sale.status = 'cancelled';
                        this.filterSales();
                        this.showNotification('판매가 취소되었습니다!', 'success');
                    }
                }
            }

            filterSales() {
                const dateFilter = document.getElementById('dateFilter').value;
                const statusFilter = document.getElementById('statusFilter').value;

                this.filteredSales = this.sales.filter(sale => {
                    const matchesDate = !dateFilter || sale.date === dateFilter;
                    const matchesStatus = !statusFilter || sale.status === statusFilter;
                    return matchesDate && matchesStatus;
                });

                this.renderSales();
                this.animateElements();
            }

            initializeCharts() {
                // 매출 추이 차트
                const salesTrendChart = echarts.init(document.getElementById('salesTrendChart'));
                const salesTrendOption = {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(255, 255, 255, 0.95)',
                        borderColor: '#e5e7eb',
                        textStyle: { color: '#374151' }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: ['월', '화', '수', '목', '금', '토', '일'],
                        axisLine: { lineStyle: { color: '#e5e7eb' } },
                        axisTick: { show: false },
                        axisLabel: { color: '#6b7280' }
                    },
                    yAxis: {
                        type: 'value',
                        axisLine: { show: false },
                        axisTick: { show: false },
                        axisLabel: { color: '#6b7280' },
                        splitLine: { lineStyle: { color: '#f3f4f6' } }
                    },
                    series: [{
                        data: [320000, 450000, 380000, 520000, 480000, 650000, 590000],
                        type: 'line',
                        smooth: true,
                        lineStyle: { color: '#3b82f6', width: 3 },
                        itemStyle: { color: '#3b82f6' },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(59, 130, 246, 0.3)' },
                                    { offset: 1, color: 'rgba(59, 130, 246, 0.05)' }
                                ]
                            }
                        }
                    }]
                };
                salesTrendChart.setOption(salesTrendOption);

                // 인기 상품 차트
                const productSalesChart = echarts.init(document.getElementById('productSalesChart'));
                const productSalesOption = {
                    tooltip: {
                        trigger: 'item',
                        backgroundColor: 'rgba(255, 255, 255, 0.95)',
                        borderColor: '#e5e7eb',
                        textStyle: { color: '#374151' }
                    },
                    series: [{
                        type: 'bar',
                        data: [
                            { value: 45, name: '무선 마우스', itemStyle: { color: '#3b82f6' } },
                            { value: 38, name: '블루투스 스피커', itemStyle: { color: '#10b981' } },
                            { value: 32, name: '노트북 가방', itemStyle: { color: '#f59e0b' } },
                            { value: 28, name: '티셔츠', itemStyle: { color: '#8b5cf6' } },
                            { value: 22, name: '청바지', itemStyle: { color: '#ef4444' } }
                        ],
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }],
                    xAxis: {
                        type: 'category',
                        data: ['무선 마우스', '블루투스 스피커', '노트북 가방', '티셔츠', '청바지'],
                        axisLine: { lineStyle: { color: '#e5e7eb' } },
                        axisTick: { show: false },
                        axisLabel: { color: '#6b7280', rotate: 45 }
                    },
                    yAxis: {
                        type: 'value',
                        axisLine: { show: false },
                        axisTick: { show: false },
                        axisLabel: { color: '#6b7280' },
                        splitLine: { lineStyle: { color: '#f3f4f6' } }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '15%',
                        containLabel: true
                    }
                };
                productSalesChart.setOption(productSalesOption);

                // 반응형 차트
                window.addEventListener('resize', () => {
                    salesTrendChart.resize();
                    productSalesChart.resize();
                });
            }

            updateCharts() {
                // 차트 데이터 업데이트 로직
                this.initializeCharts();
            }

            animateElements() {
                anime({
                    targets: '#salesTableBody tr',
                    opacity: [0, 1],
                    translateY: [20, 0],
                    duration: 500,
                    delay: anime.stagger(50),
                    easing: 'easeOutQuad'
                });
            }

            showNotification(message, type = 'success') {
                const notification = document.createElement('div');
                notification.className = `fixed top-4 right-4 z-50 p-4 rounded-lg shadow-lg max-w-sm transform translate-x-full transition-transform duration-300`;
                
                const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
                notification.classList.add(bgColor);
                
                notification.innerHTML = `
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-white mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span class="text-white font-medium">${message}</span>
                    </div>
                `;

                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.transform = 'translateX(0)';
                }, 100);

                setTimeout(() => {
                    notification.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        if (notification.parentNode) {
                            notification.parentNode.removeChild(notification);
                        }
                    }, 300);
                }, 3000);
            }
        }

        // 초기화
        const salesManager = new SalesManager();
    </script>
</body>
</html>
