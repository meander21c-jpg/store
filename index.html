<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합 건강관리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .tab-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .content-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }

        .content-card.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .medicine-checklist {
            display: grid;
            gap: 15px;
        }

        .medicine-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }

        .medicine-item:hover {
            background: #e9ecef;
        }

        .medicine-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .medicine-item.checked {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }

        .medicine-info {
            flex: 1;
        }

        .medicine-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .medicine-time {
            color: #666;
            font-size: 14px;
        }

        .record-list {
            margin-top: 20px;
        }

        .record-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        .record-body {
            color: #666;
            line-height: 1.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .chart-container {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 종합 건강관리</h1>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('dashboard')">대시보드</button>
            <button class="tab-button" onclick="showTab('medicine')">💊 약 복용</button>
            <button class="tab-button" onclick="showTab('blood-pressure')">❤️ 혈압</button>
            <button class="tab-button" onclick="showTab('weight')">⚖️ 체중</button>
            <button class="tab-button" onclick="showTab('exercise')">🏃 운동</button>
            <button class="tab-button" onclick="showTab('meal')">🍽️ 식사</button>
        </div>

        <!-- 대시보드 -->
        <div id="dashboard" class="content-card active">
            <h2 style="margin-bottom: 20px; color: #333;">📊 오늘의 건강 현황</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">복용 완료</div>
                    <div class="stat-value" id="todayMedicine">0/5</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">최근 혈압</div>
                    <div class="stat-value" id="latestBP">-/-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">현재 체중</div>
                    <div class="stat-value" id="latestWeight">- kg</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">오늘 운동</div>
                    <div class="stat-value" id="todayExercise">0분</div>
                </div>
            </div>
            <div class="chart-container">
                <h3 style="margin-bottom: 15px; color: #333;">최근 7일 기록</h3>
                <p style="color: #666;">각 탭에서 기록을 입력하시면 여기에 통계가 표시됩니다.</p>
            </div>
        </div>

        <!-- 약 복용 체크 -->
        <div id="medicine" class="content-card">
            <h2 style="margin-bottom: 20px; color: #333;">💊 오늘의 약 복용 체크</h2>
            <div class="medicine-checklist" id="medicineChecklist"></div>
        </div>

        <!-- 혈압 기록 -->
        <div id="blood-pressure" class="content-card">
            <h2 style="margin-bottom: 20px; color: #333;">❤️ 혈압 기록</h2>
            <div class="two-column">
                <div class="input-group">
                    <label>수축기 혈압 (mmHg)</label>
                    <input type="number" id="systolic" placeholder="예: 120">
                </div>
                <div class="input-group">
                    <label>이완기 혈압 (mmHg)</label>
                    <input type="number" id="diastolic" placeholder="예: 80">
                </div>
            </div>
            <div class="two-column">
                <div class="input-group">
                    <label>측정 날짜</label>
                    <input type="date" id="bpDate">
                </div>
                <div class="input-group">
                    <label>측정 시간</label>
                    <input type="time" id="bpTime">
                </div>
            </div>
            <div class="input-group">
                <label>메모</label>
                <textarea id="bpNote" placeholder="예: 아침 식전, 기분 좋음"></textarea>
            </div>
            <button class="btn" onclick="addBloodPressure()">혈압 기록 저장</button>
            <div class="record-list" id="bpRecords"></div>
        </div>

        <!-- 체중 기록 -->
        <div id="weight" class="content-card">
            <h2 style="margin-bottom: 20px; color: #333;">⚖️ 체중 기록</h2>
            <div class="two-column">
                <div class="input-group">
                    <label>체중 (kg)</label>
                    <input type="number" step="0.1" id="weightValue" placeholder="예: 70.5">
                </div>
                <div class="input-group">
                    <label>측정 날짜</label>
                    <input type="date" id="weightDate">
                </div>
            </div>
            <div class="input-group">
                <label>메모</label>
                <textarea id="weightNote" placeholder="예: 아침 공복 상태"></textarea>
            </div>
            <button class="btn" onclick="addWeight()">체중 기록 저장</button>
            <div class="record-list" id="weightRecords"></div>
        </div>

        <!-- 운동 기록 -->
        <div id="exercise" class="content-card">
            <h2 style="margin-bottom: 20px; color: #333;">🏃 운동 기록</h2>
            <div class="two-column">
                <div class="input-group">
                    <label>운동 종류</label>
                    <select id="exerciseType">
                        <option value="걷기">걷기</option>
                        <option value="조깅">조깅</option>
                        <option value="수영">수영</option>
                        <option value="자전거">자전거</option>
                        <option value="스트레칭">스트레칭</option>
                        <option value="근력운동">근력운동</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>운동 시간 (분)</label>
                    <input type="number" id="exerciseDuration" placeholder="예: 30">
                </div>
            </div>
            <div class="input-group">
                <label>날짜</label>
                <input type="date" id="exerciseDate">
            </div>
            <div class="input-group">
                <label>메모</label>
                <textarea id="exerciseNote" placeholder="예: 공원에서 가볍게 걸음"></textarea>
            </div>
            <button class="btn" onclick="addExercise()">운동 기록 저장</button>
            <div class="record-list" id="exerciseRecords"></div>
        </div>

        <!-- 식사 기록 -->
        <div id="meal" class="content-card">
            <h2 style="margin-bottom: 20px; color: #333;">🍽️ 식사 기록</h2>
            <div class="two-column">
                <div class="input-group">
                    <label>식사 시간</label>
                    <select id="mealTime">
                        <option value="아침">아침</option>
                        <option value="점심">점심</option>
                        <option value="저녁">저녁</option>
                        <option value="간식">간식</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>날짜</label>
                    <input type="date" id="mealDate">
                </div>
            </div>
            <div class="input-group">
                <label>식사 내용</label>
                <textarea id="mealContent" placeholder="예: 현미밥, 된장찌개, 생선구이, 나물"></textarea>
            </div>
            <div class="input-group">
                <label>메모</label>
                <textarea id="mealNote" placeholder="예: 싱겁게 먹음, 물 많이 마심"></textarea>
            </div>
            <button class="btn" onclick="addMeal()">식사 기록 저장</button>
            <div class="record-list" id="mealRecords"></div>
        </div>
    </div>

    <script>
        // 데이터 저장소
        let healthData = {
            medicines: [
                { name: '스타틴 (콜레스테롤)', time: '저녁 식후', checked: false },
                { name: '챔픽스 (금연)', time: '아침, 저녁 식후', checked: false },
                { name: '혈압약', time: '아침 식후', checked: false },
                { name: '통풍약', time: '아침 식후', checked: false },
                { name: '수면유도제', time: '취침 전', checked: false }
            ],
            bloodPressure: [],
            weight: [],
            exercise: [],
            meals: []
        };

        // 초기화
        function init() {
            setTodayDate();
            loadMedicines();
            updateDashboard();
            loadRecords();
        }

        // 오늘 날짜 자동 입력
        function setTodayDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bpDate').value = today;
            document.getElementById('weightDate').value = today;
            document.getElementById('exerciseDate').value = today;
            document.getElementById('mealDate').value = today;
            
            const now = new Date().toTimeString().slice(0, 5);
            document.getElementById('bpTime').value = now;
        }

        // 탭 전환
        function showTab(tabId) {
            // 모든 탭과 콘텐츠 비활성화
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-card').forEach(card => card.classList.remove('active'));
            
            // 선택한 탭 활성화
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // 약 체크리스트 로드
        function loadMedicines() {
            const container = document.getElementById('medicineChecklist');
            container.innerHTML = '';
            
            healthData.medicines.forEach((med, index) => {
                const div = document.createElement('div');
                div.className = `medicine-item ${med.checked ? 'checked' : ''}`;
                div.innerHTML = `
                    <input type="checkbox" ${med.checked ? 'checked' : ''} onchange="toggleMedicine(${index})">
                    <div class="medicine-info">
                        <div class="medicine-name">${med.name}</div>
                        <div class="medicine-time">${med.time}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 약 복용 체크 토글
        function toggleMedicine(index) {
            healthData.medicines[index].checked = !healthData.medicines[index].checked;
            loadMedicines();
            updateDashboard();
        }

        // 혈압 기록 추가
        function addBloodPressure() {
            const systolic = document.getElementById('systolic').value;
            const diastolic = document.getElementById('diastolic').value;
            const date = document.getElementById('bpDate').value;
            const time = document.getElementById('bpTime').value;
            const note = document.getElementById('bpNote').value;

            if (!systolic || !diastolic || !date || !time) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }

            healthData.bloodPressure.unshift({
                systolic,
                diastolic,
                date,
                time,
                note,
                timestamp: new Date().getTime()
            });

            // 입력 필드 초기화
            document.getElementById('systolic').value = '';
            document.getElementById('diastolic').value = '';
            document.getElementById('bpNote').value = '';
            setTodayDate();

            loadRecords();
            updateDashboard();
            alert('혈압 기록이 저장되었습니다!');
        }

        // 체중 기록 추가
        function addWeight() {
            const weight = document.getElementById('weightValue').value;
            const date = document.getElementById('weightDate').value;
            const note = document.getElementById('weightNote').value;

            if (!weight || !date) {
                alert('체중과 날짜를 입력해주세요.');
                return;
            }

            healthData.weight.unshift({
                weight,
                date,
                note,
                timestamp: new Date().getTime()
            });

            document.getElementById('weightValue').value = '';
            document.getElementById('weightNote').value = '';
            setTodayDate();

            loadRecords();
            updateDashboard();
            alert('체중 기록이 저장되었습니다!');
        }

        // 운동 기록 추가
        function addExercise() {
            const type = document.getElementById('exerciseType').value;
            const duration = document.getElementById('exerciseDuration').value;
            const date = document.getElementById('exerciseDate').value;
            const note = document.getElementById('exerciseNote').value;

            if (!type || !duration || !date) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }

            healthData.exercise.unshift({
                type,
                duration,
                date,
                note,
                timestamp: new Date().getTime()
            });

            document.getElementById('exerciseDuration').value = '';
            document.getElementById('exerciseNote').value = '';
            setTodayDate();

            loadRecords();
            updateDashboard();
            alert('운동 기록이 저장되었습니다!');
        }

        // 식사 기록 추가
        function addMeal() {
            const time = document.getElementById('mealTime').value;
            const date = document.getElementById('mealDate').value;
            const content = document.getElementById('mealContent').value;
            const note = document.getElementById('mealNote').value;

            if (!time || !date || !content) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }

            healthData.meals.unshift({
                time,
                date,
                content,
                note,
                timestamp: new Date().getTime()
            });

            document.getElementById('mealContent').value = '';
            document.getElementById('mealNote').value = '';
            setTodayDate();

            loadRecords();
            alert('식사 기록이 저장되었습니다!');
        }

        // 기록 불러오기
        function loadRecords() {
            // 혈압 기록
            const bpContainer = document.getElementById('bpRecords');
            bpContainer.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 15px;">기록 내역</h3>';
            healthData.bloodPressure.forEach((record, index) => {
                bpContainer.innerHTML += `
                    <div class="record-item">
                        <div class="record-header">
                            <span>${record.date} ${record.time}</span>
                            <button class="delete-btn" onclick="deleteRecord('bloodPressure', ${index})">삭제</button>
                        </div>
                        <div class="record-body">
                            <strong>${record.systolic}/${record.diastolic} mmHg</strong><br>
                            ${record.note ? record.note : ''}
                        </div>
                    </div>
                `;
            });

            // 체중 기록
            const weightContainer = document.getElementById('weightRecords');
            weightContainer.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 15px;">기록 내역</h3>';
            healthData.weight.forEach((record, index) => {
                weightContainer.innerHTML += `
                    <div class="record-item">
                        <div class="record-header">
                            <span>${record.date}</span>
                            <button class="delete-btn" onclick="deleteRecord('weight', ${index})">삭제</button>
                        </div>
                        <div class="record-body">
                            <strong>${record.weight} kg</strong><br>
                            ${record.note ? record.note : ''}
                        </div>
                    </div>
                `;
            });

            // 운동 기록
            const exerciseContainer = document.getElementById('exerciseRecords');
            exerciseContainer.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 15px;">기록 내역</h3>';
            healthData.exercise.forEach((record, index) => {
                exerciseContainer.innerHTML += `
                    <div class="record-item">
                        <div class="record-header">
                            <span>${record.date}</span>
                            <button class="delete-btn" onclick="deleteRecord('exercise', ${index})">삭제</button>
                        </div>
                        <div class="record-body">
                            <strong>${record.type} - ${record.duration}분</strong><br>
                            ${record.note ? record.note : ''}
                        </div>
                    </div>
                `;
            });

            // 식사 기록
            const mealContainer = document.getElementById('mealRecords');
            mealContainer.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 15px;">기록 내역</h3>';
            healthData.meals.forEach((record, index) => {
                mealContainer.innerHTML += `
                    <div class="record-item">
                        <div class="record-header">
                            <span>${record.date} - ${record.time}</span>
                            <button class="delete-btn" onclick="deleteRecord('meals', ${index})">삭제</button>
                        </div>
                        <div class="record-body">
                            <strong>${record.content}</strong><br>
                            ${record.note ? record.note : ''}
                        </div>
                    </div>
                `;
            });
        }

        // 기록 삭제
        function deleteRecord(type, index) {
            if (confirm('이 기록을 삭제하시겠습니까?')) {
                healthData[type].splice(index, 1);
                loadRecords();
                updateDashboard();
            }
        }

        // 대시보드 업데이트
        function updateDashboard() {
            // 약 복용 현황
            const checkedCount = healthData.medicines.filter(m => m.checked).length;
            document.getElementById('todayMedicine').textContent = `${checkedCount}/${healthData.medicines.length}`;

            // 최근 혈압
            if (healthData.bloodPressure.length > 0) {
                const latest = healthData.bloodPressure[0];
                document.getElementById('latestBP').textContent = `${latest.systolic}/${latest.diastolic}`;
            }

            // 최근 체중
            if (healthData.weight.length > 0) {
                const latest = healthData.weight[0];
                document.getElementById('latestWeight').textContent = `${latest.weight} kg`;
            }

            // 오늘 운동
            const today = new Date().toISOString().split('T')[0];
            const todayExercise = healthData.exercise
                .filter(e => e.date === today)
                .reduce((sum, e) => sum + parseInt(e.duration), 0);
            document.getElementById('todayExercise').textContent = `${todayExercise}분`;
        }

        // 페이지 로드 시 초기화
        init();
    </script>
</body>
