<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>특약 선택·복사 도구</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e2e5ea;--ink:#1f2933;--sub:#667085;--main:#1d4ed8;--main-bg:#e8efff;--ok:#047857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.3}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.desc{color:var(--sub);font-size:13px;margin:0 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{flex:1;min-width:140px;padding:12px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink)}
.tab.on{border-color:var(--main);background:var(--main-bg);color:var(--main)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input[type=search]{flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
button.s{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px}
button.s:hover{background:var(--bg)}
.gt{font-size:13px;font-weight:700;color:var(--main);margin:8px 0 2px;padding-bottom:2px;border-bottom:2px solid var(--main-bg);display:flex;justify-content:space-between;align-items:center}
.gt button{font-size:12px;border:0;background:none;color:var(--sub);cursor:pointer;text-decoration:underline}
.item{display:flex;gap:6px;padding:1px 6px;margin:0;border:1px solid transparent;border-radius:4px;cursor:pointer;font-size:14px;line-height:1.3}
.item:hover{background:var(--bg)}
.item.sel{background:var(--main-bg);border-color:#b9ccff}
.item input{margin:2px 0 0;width:15px;height:15px;flex:none}
.list{max-height:70vh;overflow:auto;padding-right:4px}
.cnt{font-size:13px;color:var(--sub)}
textarea{width:100%;height:46vh;min-height:240px;padding:10px;border:1px solid var(--line);border-radius:8px;font:14px/1.3 "Malgun Gothic",sans-serif;resize:vertical}
.copy{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;background:var(--main);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.copy:active{opacity:.85}
.copy.done{background:var(--ok)}
.opt{font-size:13px;color:var(--sub);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
select{padding:5px;border:1px solid var(--line);border-radius:6px}
.tip{font-size:12px;color:var(--sub);margin-top:6px}
.empty{color:var(--sub);font-size:13px;padding:6px}
.rw{display:none;margin-top:14px;padding-top:10px;border-top:2px solid var(--main-bg)}
.rw .btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.rw .btns button{flex:1;min-width:90px;padding:9px 6px;border:1px solid var(--main);background:#fff;color:var(--main);border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.rw .btns button:hover{background:var(--main-bg)}
.rw .btns button:disabled{opacity:.5;cursor:wait}
.rw textarea{height:30vh;min-height:160px}
</style>
</head>
<body>
<div class="wrap">
<h1>특약 선택·복사 도구</h1>
<p class="desc">① 위에서 계약 종류 선택 → ② 필요한 특약 클릭 → ③ 오른쪽 [복사하기] → 계약서에 붙여넣기(Ctrl+V)</p>
<div class="tabs" id="tabs"></div>
<div class="grid">
  <div class="card">
    <div class="bar">
      <input type="search" id="q" placeholder="특약 검색 (예: 반려동물, 연체)">
      <button class="s" id="selAll">전체 선택</button>
      <button class="s" id="clrAll">전체 해제</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="card">
    <div class="bar"><b>선택한 특약 미리보기</b><span class="cnt" id="cnt"></span></div>
    <div class="opt">머리표
      <select id="mark"><option value="▶">▶</option><option value="num">1. 2. 3.</option><option value="none">없음</option></select>
      <span>※ 아래 글은 직접 수정할 수 있어요 (은행명, 금액 등 빈칸 채우기)</span>
    </div>
    <textarea id="out" placeholder="왼쪽에서 특약을 클릭하면 여기에 모입니다."></textarea>
    <button class="copy" id="copy">📋 선택한 특약 복사하기</button>
    <div class="tip" id="tip"></div>
    <div class="rw" id="rw">
      <b>✨ 선택한 특약 다시 쓰기</b>
      <div class="tip">위 미리보기 글을 원하는 스타일로 Claude가 다시 작성합니다. (위 글은 그대로 유지됩니다)</div>
      <div class="btns" id="rwBtns">
        <button data-k="short">축약본</button>
        <button data-k="detail">상세 설명</button>
        <button data-k="polite">정중한 표현</button>
        <button data-k="firm">단호한 표현</button>
      </div>
      <div class="cnt" id="rwStat"></div>
      <textarea id="rwOut" placeholder="다시 쓴 결과가 여기에 나옵니다. 직접 수정도 가능합니다."></textarea>
      <button class="copy" id="rwCopy">📋 다시 쓴 결과 복사하기</button>
    </div>
  </div>
</div>
</div>
<script>
var DATA = [{"key": "house", "label": "주택 임대차", "groups": [{"name": "기본 특약 (대부분 계약에 넣는 항목)", "items": ["현 시설물 상태로 임대차합니다.", "명시 이외 사항은 민법 및 관례에 따릅니다.", "임차인이 계약일부터 30일 이내 주택임대차계약신고를 합니다.(행정복지센터)", "월차임에 명기준 관리비(상하수도, 공동전기, 계단청소, 정화조)  원/월 별도,포함", "임대인 계좌 : 은행 (예금주:)", "채권최고액 : 금 원, 근저당권자:", "첨부서류 : 등기사항전부증명서, 건축물대장, 확인설명서, 공제증서", "비밀번호 : 현관, 세대"]}, {"name": "추가 특약 (상황별 선택)", "items": ["중개계약이 아닌 쌍방협의 임의계약입니다.", "도배, 장판을 임대인이 교체 해주기로합니다", "임차인은 임대 목적물의 사용과 관련하여 발생하는 소음이 주변에 피해를 주지 않도록 세심한 주의를 기울여야합니다", "제공 옵션(에어컨, 세탁기, 냉장고, 가스레인지, TV 등)은 서비스로서, 고장 시 임차인 비용으로 수리하며, 임대차 종료시 반환합니다", "소수선(하수구 막힘, 수전, 전등 교체 등)은 임차인 부담, 대수선(누수, 보일러 고장 등)은 임대인이 수리합니다.", "임차인이 월세 2개월 이상 연체 또는 연락 두절 시, 임대인은 집기를 외부로 반출하고 계약을 종료할 수 있습니다."]}, {"name": "추가 특약 2 (상황별 선택)", "items": ["계약일로부터 30일 이내 임대인/임차인은 행정복지센터 또는 부동산거래관리시스템을 통해 주택임대차계약신고를 해야 합니다.(미이행시 과태료 대상)", "임차인은 계약 만료 시 목적물 원형을 보존해야 합니다.", "주요 구조부 및 노후 수리는 임대인, 소모품 및 임차인 귀책 수리는 임차인이 부담합니다.", "임차인은 계약 만료 시 훼손 부분 원상 복구 후 반환합니다.", "임차인 귀책 파손 시, 원상복구 비용은 보증금에서 공제합니다.", "계약 중도 해지 시 임차인은 신규 임차인을 주선하고 중개보수 등 제반 비용을 부담합니다.", "계약 종료시 청소 완료 후 반환합니다. 이행하지 않을 시 소정의 비용이 청구될 수 있습니다.", "미납 월세는 연 20%의 이자가 가산되어 보증금에서 공제합니다. (예: 월세 50만원 1개월 미납 시 8,333원)", "계약 만료 전에 임차인이 계약 종료 시 중개 수수료는 임차인이 부담합니다.", "반환보증금은 다음 세입자 잔금 시 지불하기로합니다.", "임대인 동의 없는 주택 구조 변경, 전대, 임차권 양도 불가합니다.", "임대인은 계약 만료일에 보증금을 즉시 반환하여야합니다.", "임대인은 전세권 설정, 보증보험 가입 등에 적극 협조하여야합니다.", "임대인은 본 계약체결 당시 국세·지방세 체납, 근저당권 이자체납 사실이 없음을 고지합니다.", "임차인은 2025년 월 일까지 전입신고 및 확정일자를 받아야 하며, 임대인은 그 다음 날까지 해당 주택에 저당권 등 담보권을 설정할 수 없습니다.", "반려동물은 사육할 수 없습니다", "이웃에 불편을 주지 않는 선에서 반려동물 사육 가능합니다", "층간소음에 유의하여 불편을 주지 않도록 합니다.", "주택 매도 시 임차인에게 사전 통지합니다.", "임차인은 쓰레기를 월, 수, 금 일몰 후에 종량제봉투에 담아 배출해야 합니다.", "실내 흡연을 금하며, 흡연으로 인한 오염 및 냄새 발생 시 임차인이 원상복구 비용을 부담합니다", "쓰레기 배출 시 생활 쓰레기, 음식물, 재활용품을 분리하여 지정된 장소에 배출합니다.", "임차인이 월세를 2회 연체시 임대인은 계약을 해지할 수 있습니다.", "임차인은 계약 만료 2개월 전까지 재연장 여부를 통보해야 하며, 미통보 시 본 계약은 동일 조건으로 자동 연장됩니다.", "임대인이 변경될 경우, 기존 계약 조건은 승계되며 임차인의 권리는 보호됩니다.", "계약종료시 임대인이 제공한 옵션외 모든 물품은 임차인이 외부로 반출합니다"]}]}, {"key": "sale", "label": "매매", "groups": [{"name": "기본 특약 (대부분 계약에 넣는 항목)", "items": ["현 시설물 상태로 매매합니다.", "특약에 명시되지 않은 사항은 민법 및 관례에 따릅니다.", "채권최고액 : 금 원, 채무자: , 근저당권자:  (소유권이전시 말소합니다)", "매수인의 청구 금액 대출 불가시 수수한 계약금만을 반환하며 계약은 무효입니다.", "중도금/잔금 납부일 및 부동산 인도일은 협의 조정 가능합니다.", "매도인 계좌 : 은행", "첨부 서류 : 등기사항전부증명서, 건축물대장, 공제증서, 확인설명서"]}, {"name": "추가 특약 (상황별 선택)", "items": ["매도인이 고지하지 않은 부분에서 6개월 이내 중대하자 발생시, 하자 보수를 청구할 수 있습니다. 단, 매수인 고의 또는 중과실 하자는 예외.", "권리관계는 잔금 지급일까지 변동 없이 유지되어야 하며, 변동 시 계약은 무효로합니다.", "잔금 시까지의  공과금은 매도인이 부담합니다."]}]}, {"key": "shop", "label": "상가 임대차", "groups": [{"name": "기본 특약 (대부분 계약에 넣는 항목)", "items": ["현 시설물 상태로 임대차합니다.", "명시 이외 사항은 민법 및 관례에 따릅니다.", "임차인이 계약일부터 30일 이내 주택임대차계약신고를 합니다.(행정복지센터)", "관리비(상하수도, 공동전기, 계단청소, 정화조)  명 기준 월 원 별도,포함", "채권최고액 : 금 원, 근저당권자:", "임대인 계좌 : 은행", "첨부서류 : 등기사항전부증명서, 건축물대장, 확인설명서, 공제증서", "상기 월차임에는 부가세 포함 금액입니다", "임차인이 월세 2개월 이상 연체 또는 연락 두절 시, 임대인은 집기를 외부로 반출하고 계약을 종료할 수 있습니다."]}, {"name": "추가 특약 (상황별 선택)", "items": ["임대차인의 쌍방 합의 계약입니다.", "본 계약서에 대한 모든 내용은 계약 당사자 간의 합의에 의한 것입니다.", "임차인의 사용 목적에 따른 건물 개보수 및 추가 시설 설치 비용은 임차인이 부담하며, 계약 만료 시 원상복구하여야 합니다.", "계약 당시 사용 목적 외 사용을 금하며, 불법적이거나 주변 영업에 지장을 줄 경우 즉시 원상복구 해야합니다. 불이행 시 조건 없이 명도합니다.", "임차인과 영업 허가권은 동일인 명의여야 하며, 변경 시 임대인의 동의를 즉시 받아야 합니다.", "임차인은 영업권 양도양수 및 인허가 문제(소방시설, 정화조, 거리 제한, 용도 제한 등)를 해당 기관에 확인 후 계약해야 하며, 미통보 및 미확인으로 인한 손해는 임대인이 책임지지 않습니다.", "임차인은 영업에 필요시 내부 소방 시설을 설치하고 화재보험에 가입해야 하며, 불이행으로 발생하는 인명 및 경제적 손실은 임차인이 책임집니다.", "임대인은 권리금 및 시설비 일체를 인정하지 않습니다.", "임차인은 계약 기간 중 본 건물 대수선 및 부분 수선 시 적극 협조해야 하며, 이로 인한 영업적 손해배상 등을 임대인에게 청구할 수 없습니다.", "부가가치세와 관리비는 합의된 금액으로 별도 지불합니다.", "계약 기간 중 임차인이 계속해서 2개월 이상 연락 두절로 임대인에게 손해가 발생할 시 임대인은 계약을 해지하고 제3자 입회하에 명도 시킬 수 있습니다.", "현 사용 공간의 공부상 면적과 실측 면적 차이가 발생하더라도 본 계약 관련 당사자 모두에게 이의를 제기하지 않습니다.", "임차인은 쓰레기를 월, 수, 금 일몰 후에 종량제봉투에 담아 배출해야 합니다.", "쓰레기 배출 시 생활 쓰레기, 음식물, 재활용품을 분리하여 지정된 장소에 배출합니다."]}]}];

DATA.forEach(function(_,i){ picked[i] = []; });

function $(id){ return document.getElementById(id); }
function isPicked(g,i){ return picked[cur].some(function(p){return p.g===g&&p.i===i;}); }
function toggle(g,i){
  var a = picked[cur], k = -1;
  a.forEach(function(p,n){ if(p.g===g&&p.i===i) k=n; });
  if(k>=0) a.splice(k,1); else a.push({g:g,i:i});
  edited = false; render();
}
function renderTabs(){
  $('tabs').innerHTML = '';
  DATA.forEach(function(t,i){
    var b = document.createElement('button');
    b.className = 'tab' + (i===cur?' on':'');
    b.textContent = t.label + (picked[i].length ? ' ('+picked[i].length+')' : '');
    b.onclick = function(){ cur=i; edited=false; render(); };
    $('tabs').appendChild(b);
  });
}
function renderList(){
  var q = $('q').value.trim();
  var box = $('list'); box.innerHTML = '';
  var shown = 0;
  DATA[cur].groups.forEach(function(gr,g){
    var head = document.createElement('div'); head.className='gt';
    head.innerHTML = '<span>'+gr.name+'</span>';
    var bt = document.createElement('button'); bt.textContent='이 묶음 전체 선택/해제';
    bt.onclick = function(){
      var all = gr.items.every(function(_,i){return isPicked(g,i);});
      gr.items.forEach(function(_,i){
        var on = isPicked(g,i);
        if(all && on) toggleQuiet(g,i); else if(!all && !on) toggleQuiet(g,i);
      });
      edited=false; render();
    };
    head.appendChild(bt); box.appendChild(head);
    gr.items.forEach(function(txt,i){
      if(q && txt.indexOf(q)<0) return;
      shown++;
      var row = document.createElement('label');
      row.className = 'item' + (isPicked(g,i)?' sel':'');
      var cb = document.createElement('input'); cb.type='checkbox'; cb.checked = isPicked(g,i);
      cb.onchange = function(){ toggle(g,i); };
      var sp = document.createElement('span'); sp.textContent = txt;
      row.appendChild(cb); row.appendChild(sp); box.appendChild(row);
    });
  });
  if(!shown){ box.innerHTML += '<div class="empty">검색 결과가 없습니다.</div>'; }
}
function toggleQuiet(g,i){
  var a = picked[cur], k=-1;
  a.forEach(function(p,n){ if(p.g===g&&p.i===i) k=n; });
  if(k>=0) a.splice(k,1); else a.push({g:g,i:i});
}
function buildText(){
  var m = $('mark').value;
  return picked[cur].map(function(p,n){
    var t = DATA[cur].groups[p.g].items[p.i];
    var pre = m==='▶' ? '▶' : (m==='num' ? (n+1)+'. ' : '');
    return pre + t;
  }).join('\n');
}
function renderOut(){
  if(!edited) $('out').value = buildText();
  $('cnt').textContent = picked[cur].length + '개 선택';
}
function render(){ renderTabs(); renderList(); renderOut(); }

$('copy').onclick = function(){
  var ta = $('out'), txt = ta.value, btn = $('copy');
  if(!txt){ $('tip').textContent='먼저 특약을 선택해 주세요.'; return; }
  function ok(){ btn.classList.add('done'); btn.textContent='✅ 복사 완료! 계약서에 Ctrl+V'; setTimeout(function(){btn.classList.remove('done');btn.textContent='📋 선택한 특약 복사하기';},2000); $('tip').textContent=''; }
  function fallback(){
    ta.focus(); ta.select();
    try{ if(document.execCommand('copy')) ok(); else $('tip').textContent='자동 복사가 막혔습니다. 위 글을 드래그해서 Ctrl+C 해주세요.'; }
    catch(e){ $('tip').textContent='자동 복사가 막혔습니다. 위 글을 드래그해서 Ctrl+C 해주세요.'; }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, fallback);
  } else fallback();
};

function setBusy(b){
  Array.prototype.forEach.call($('rwBtns').querySelectorAll('button'), function(x){ x.disabled = b; });
}
function rewrite(kind){
  var src = $('out').value.trim();
  if(!src){ $('rwStat').textContent = '먼저 왼쪽에서 특약을 선택해 주세요.'; return; }
  if(!sampleFn){ $('rwStat').textContent = '다시 쓰기 기능을 사용할 수 없습니다.'; return; }

  $('rwStat').textContent = '작성 중입니다...';
  $('rwOut').value = '';
  var prompt = RULE + '\n\n' + STYLES[kind] + '\n\n[특약사항]\n' + src;
  sampleFn(prompt, {
    cache: false,
    onText: function(t){ if(t && t.text) $('rwOut').value = t.text; }
  }).then(function(r){
    if(r && r.text) $('rwOut').value = r.text.trim();
    $('rwStat').textContent = '완료! 내용을 확인하고 필요하면 수정한 뒤 복사하세요.';
  }).catch(function(e){
    $('rwStat').textContent = (e && e.code === 'rate_limited') ? '요청이 많습니다. 잠시 후 다시 눌러 주세요.' : '다시 쓰기에 실패했습니다. 다시 한 번 눌러 주세요.';
  }).then(function(){ setBusy(false); });
}
